# Where scripts/find_new.py looks for projects that are not catalogued yet (results go to state/NEW.md).
#
# searches:   GitHub repository searches (names, descriptions, topics). Repos pushed within `days` are reported.
# topics:     GitHub topics, searched the same way.
# itch:       itch.io tag feeds; youtube: YouTube search (needs the YOUTUBE_API_KEY secret).
# storefront: the NextUI Pak Store's storefront file; every pak listed there and not catalogued is reported.

days: 30

searches:
  - trimui brick
  - trimui
  - tg3040
  - tg5040
  - brick pro trimui
  - nextui pak
  - nextui
  - minui pak
  - knulli brick
  - knulli synth
  - knulli tracker
  - nextui synth
  - nextui tracker
  - nextui music
  - brick synth
  - brick sampler
  - brick sequencer
  - brick tracker
  - handheld tracker
  - handheld synth
  - handheld groovebox
  - m8c handheld

readme_searches:       # README text: finds repos whose name and description do not mention the Brick
  - trimui brick
  - brick pro knulli
  - nextui pak
  - knulli synth
  - knulli sequencer
  - knulli sampler
  - knulli tracker
  - knulli looper
  - knulli groovebox

forks_too:            # these searches also list forks (NextUI and most CFWs are forks)
  - trimui brick
  - nextui
  - knulli

topics:
  - trimui
  - trimui-brick
  - trimui-brick-pro
  - nextui
  - tg5040
  - minui

# which hits count: the name, description or topic must match this (case-insensitive); keeps out the unrelated
# "NextUI" React library and the French word "minuit"
must_match: "trimui|\\bbrick\\b|brick ?pro|tg[345]0[45]0|nextui.*(pak|trimui|handheld|cfw)|\\bpak\\b|minui.*pak|knulli"
must_not_match: "minuit|heroui|nextui-org|react|tailwind|next\\.?js|vite|laravel|angular|lego"

# itch.io tag feeds (https://itch.io/<kind>/newest/tag-<tag>.xml). Music apps for the Brick are often only here.
itch:
  kinds: [tools, games, soundtracks]
  tags: [trimui-brick, trimui, trimui-brick-pro, nextui, knulli, portmaster]

# YouTube search: runs only when the YOUTUBE_API_KEY secret is set (free key from Google Cloud, YouTube Data API v3).
# Each query costs 100 of the 10,000 daily units; every three days that is far below the limit.
youtube:
  must_match: "trimui|\\bbrick\\b"
  # the video title must name a kind of music software; keeps out device reviews and unboxings
  title_must_match: "sampler|synth|groovebox|sequencer|looper|tracker|\\bfx\\b|multi-?fx|effect|midi|chord|granular|drum|beat|vocoder|player|recorder|music|ambient|techno|jam|m8|instrument|dmx"
  # project names too common to identify a project in a video title
  generic_names: [Tracker, Music Player, Player, Sampler, Looper, Recorder, Speed, Terminal, Portmaster, Kino, Tuner]
  queries:
    - trimui brick groovebox
    - trimui brick sequencer
    - trimui brick synth
    - trimui brick sampler
    - trimui brick looper
    - trimui brick tracker
    - trimui brick music app
    - trimui brick pro music
    - trimui brick midi
    - trimui brick knulli app

storefront:
  repo: https://github.com/LoveRetro/nextui-pak-store
  file: storefront_base.json
